name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 1.2.3)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Only the dictionary engine is a build input. The repositories under
      # reference/ are reading material, and one of them pins a commit that no
      # longer exists upstream, so a recursive checkout of everything fails.
      - name: Check out the hoshidicts bridge
        run: git submodule update --init --recursive third_party/hoshidicts-kotlin-bridge

      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must be MAJOR.MINOR.PATCH, got '$version'." >&2
            exit 1
          fi
          major=${version%%.*}
          rest=${version#*.}
          minor=${rest%%.*}
          patch=${rest#*.}
          # 1.2.3 -> 10203, which keeps version codes ordered as long as minor
          # and patch each stay below 100.
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "Minor and patch must each stay below 100 for this versionCode scheme." >&2
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the NDK and CMake
        run: |
          set -euo pipefail
          # The runner image does not reliably put cmdline-tools on PATH, so
          # find sdkmanager rather than assuming it.
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          sdkmanager_bin=""
          for candidate in \
            "$(command -v sdkmanager || true)" \
            "$sdk_root/cmdline-tools/latest/bin/sdkmanager" \
            "$sdk_root/tools/bin/sdkmanager"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              sdkmanager_bin="$candidate"
              break
            fi
          done
          if [ -z "$sdkmanager_bin" ]; then
            echo "Could not find sdkmanager under '$sdk_root'." >&2
            ls -la "$sdk_root" "$sdk_root/cmdline-tools" 2>/dev/null || true
            exit 1
          fi
          echo "Using $sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true
          "$sdkmanager_bin" --install "ndk;29.0.14206865" "cmake;3.31.6"

      # Runs unconditionally: a step-level `if` cannot see a secret exported in
      # that same step's own `env` block.
      - name: Decode the signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No keystore secret is configured; the APK will be unsigned."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PreleaseVersionName='${{ steps.version.outputs.name }}' \
            -PreleaseVersionCode='${{ steps.version.outputs.code }}'

      - name: Name the APK after the release
        id: apk
        run: |
          set -euo pipefail
          built=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          if [ -z "$built" ]; then
            echo "No APK was produced." >&2
            exit 1
          fi
          # An unsigned APK keeps "-unsigned" in its name; carry that through so
          # nobody mistakes one for an installable build.
          suffix=""
          signed=true
          case "$built" in
            *unsigned*) suffix="-unsigned"; signed=false ;;
          esac
          target="Donguri-${{ steps.version.outputs.name }}$suffix.apk"
          mv "$built" "$target"
          echo "path=$target" >> "$GITHUB_OUTPUT"
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      # Also published as a workflow artifact: artifacts are visible on the run
      # page without publishing anything, which makes a release problem easy to
      # tell apart from a build problem.
      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: donguri-${{ steps.version.outputs.name }}-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v${{ steps.version.outputs.name }}'
          apk='${{ steps.apk.outputs.path }}'
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Donguri ${{ steps.version.outputs.name }} for Android (arm64-v8a).

          Signed: ${{ steps.apk.outputs.signed }}

          Donguri ships with no dictionaries — open **⚙︎ → Dictionaries → Download
          recommended dictionaries** on first run.
          NOTES
          # Left as a draft so a human publishes it, and re-runnable: a second
          # run for the same tag replaces the asset rather than failing.
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; replacing its APKs."
            # Not just --clobber: a rebuild can change the asset's name (an
            # unsigned build carries a -unsigned suffix), and the stale one
            # would otherwise sit alongside the new build.
            gh release view "$tag" --json assets \
              --jq '.assets[] | select(.name | endswith(".apk")) | .name' \
              | while read -r stale; do
                  echo "Removing stale asset $stale"
                  gh release delete-asset "$tag" "$stale" --yes
                done
            gh release upload "$tag" "$apk" --clobber
          else
            echo "Creating draft release $tag."
            gh release create "$tag" "$apk" \
              --title "Donguri ${{ steps.version.outputs.name }}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --draft
          fi

          # Prove what actually ended up attached, rather than trusting the
          # exit status of the command above.
          echo "Assets now on $tag:"
          gh release view "$tag" --json assets \
            --jq '.assets[] | "  \(.name) (\(.size) bytes)"'
          if [ "$(gh release view "$tag" --json assets --jq '[.assets[] | select(.name | endswith(".apk"))] | length')" = "0" ]; then
            echo "No APK is attached to $tag." >&2
            exit 1
          fi
