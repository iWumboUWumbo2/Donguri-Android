name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Only the dictionary engine is a build input. The repositories under
      # reference/ are reading material, and one of them pins a commit that no
      # longer exists upstream, so a recursive checkout of everything fails.
      - name: Check out the hoshidicts bridge
        run: git submodule update --init --recursive third_party/hoshidicts-kotlin-bridge

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the NDK and CMake
        run: |
          set -euo pipefail
          # The runner image does not reliably put cmdline-tools on PATH, so
          # find sdkmanager rather than assuming it.
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          sdkmanager_bin=""
          for candidate in \
            "$(command -v sdkmanager || true)" \
            "$sdk_root/cmdline-tools/latest/bin/sdkmanager" \
            "$sdk_root/tools/bin/sdkmanager"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              sdkmanager_bin="$candidate"
              break
            fi
          done
          if [ -z "$sdkmanager_bin" ]; then
            echo "Could not find sdkmanager under '$sdk_root'." >&2
            ls -la "$sdk_root" "$sdk_root/cmdline-tools" 2>/dev/null || true
            exit 1
          fi
          echo "Using $sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true
          "$sdkmanager_bin" --install "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Build and test
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest

      # The release build is where R8, resource shrinking and lintVital run, and
      # it has broken on its own before while the debug build stayed green.
      - name: Build release
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: donguri-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
